name: Republish Desktop

# Rebuild Desktop installers for an already-published tag and attach them
# with `gh release upload --clobber`. Used when a Release desktop job
# timed out or electron-builder skipped uploads because the GitHub
# Release was more than 2 hours old.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag (e.g. v1.5.117)
        required: true
        type: string
      target:
        description: Desktop target to rebuild
        required: true
        type: choice
        options:
          - linux
          - win
          - mac
        default: linux

permissions:
  contents: write

jobs:
  desktop:
    if: github.repository_owner == 'DrOlu'
    runs-on: ${{ inputs.target == 'win' && 'windows-latest' || inputs.target == 'mac' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: inputs.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ inputs.target }})
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ inputs.target }} ${{ inputs.target == 'mac' && '--arm64' || '--x64 --arm64' }} --publish never

      - name: Stash installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.target }}-${{ inputs.tag }}
          path: |
            apps/desktop/dist/**/*.AppImage
            apps/desktop/dist/**/*.deb
            apps/desktop/dist/**/*.rpm
            apps/desktop/dist/**/*.yml
            apps/desktop/dist/**/*.exe
            apps/desktop/dist/**/*.dmg
            apps/desktop/dist/**/*.zip
            apps/desktop/dist/**/*.blockmap
          if-no-files-found: error
          retention-days: 5

      - name: Upload installers to ${{ inputs.tag }}
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.yml' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) ! -path '*unpacked*' ! -name 'builder-debug.yml')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No publishable artifacts under apps/desktop/dist"
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            echo "==> $(basename "$f")"
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber -R "$REPO"; then
                ok=1
                break
              fi
              echo "upload failed (attempt ${attempt}/5), retrying in 20s"
              sleep 20
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "giving up on $(basename "$f")"
              failed=1
            fi
          done
          exit "$failed"
